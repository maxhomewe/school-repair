<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>國中校內設備報修與進度查詢系統</title>
    <!-- 載入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-5xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-wrench text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">國中校內報修管理系統</h1>
            </div>
            <!-- 切換頁籤 -->
            <nav class="flex bg-indigo-700 rounded-lg p-1 space-x-1 text-sm">
                <button id="tab-form-btn" onclick="switchTab('form')" class="px-4 py-2 rounded-md font-medium transition bg-white text-indigo-700 shadow">
                    <i class="fa-solid fa-pen-to-square mr-1"></i>我要報修
                </button>
                <button id="tab-tracker-btn" onclick="switchTab('tracker')" class="px-4 py-2 rounded-md font-medium transition text-indigo-100 hover:text-white">
                    <i class="fa-solid fa-list-check mr-1"></i>進度查詢
                </button>
                <button id="tab-admin-btn" onclick="switchTab('admin')" class="px-4 py-2 rounded-md font-medium transition text-indigo-100 hover:text-white">
                    <i class="fa-solid fa-user-gear mr-1"></i>總務處管理
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-5xl mx-auto px-4 py-8">

        <!-- 頁籤 1：我要報修 -->
        <section id="tab-form" class="bg-white rounded-xl shadow-md p-6 border border-slate-100">
            <div class="mb-6 border-b pb-4">
                <h2 class="text-lg font-bold text-slate-700">新增設備報修單</h2>
                <p class="text-sm text-slate-500">請詳細填寫公物損壞狀況，總務處將盡快安排檢修。</p>
            </div>

            <form id="repair-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">報修地點 <span class="text-red-500">*</span></label>
                        <input type="text" id="location" required placeholder="例如：701教室、圖書館2樓" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">設備類別 <span class="text-red-500">*</span></label>
                        <select id="category" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="">請選擇類別</option>
                            <option value="水電設施">水電設施（燈具、插座、水龍頭）</option>
                            <option value="資訊/視聽">資訊/視聽（投影機、電腦、喇叭）</option>
                            <option value="桌椅家具">桌椅家具（課桌椅、門窗、櫃子）</option>
                            <option value="冷氣通風">冷氣通風（冷氣機、電風扇）</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">報修人 / 班級 <span class="text-red-500">*</span></label>
                        <input type="text" id="reporter" required placeholder="例如：701總務股長 王小明" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">緊急程度 <span class="text-red-500">*</span></label>
                        <select id="urgency" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="普通">普通（不影響正常教學）</option>
                            <option value="高">高（影響教學或有安全隱患）</option>
                            <option value="緊急">緊急（嚴重影響安全或極度緊急）</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">故障狀況描述 <span class="text-red-500">*</span></label>
                    <textarea id="description" rows="4" required placeholder="請具體說明損壞情況，例如：前門冷氣不冷且發出異音..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow">
                        <i class="fa-solid fa-paper-plane mr-2"></i>送出報修單
                    </button>
                </div>
            </form>
        </section>

        <!-- 頁籤 2：進度查詢 -->
        <section id="tab-tracker" class="space-y-4 hidden">
            <!-- 搜尋與篩選 -->
            <div class="bg-white rounded-xl shadow-md p-4 border border-slate-100 flex flex-col md:flex-row gap-3">
                <input type="text" id="search-input" oninput="renderTracker()" placeholder="搜尋地點或描述..." class="flex-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                <select id="filter-status" onchange="renderTracker()" class="px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    <option value="all">所有處理狀態</option>
                    <option value="已送出">已送出</option>
                    <option value="維修中">維修中</option>
                    <option value="已完工">已完工</option>
                </select>
            </div>

            <!-- 清單列表 -->
            <div id="tracker-list" class="space-y-3">
                <!-- JavaScript 動態渲染項目 -->
            </div>
        </section>

        <!-- 頁籤 3：總務處管理後台（模擬狀態變更） -->
        <section id="tab-admin" class="bg-white rounded-xl shadow-md p-6 border border-slate-100 hidden">
            <div class="mb-6 border-b pb-4">
                <h2 class="text-lg font-bold text-slate-700">總務處報修管理面板</h2>
                <p class="text-sm text-slate-500">可在這裡即時更新報修單的處理進度。</p>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left text-sm">
                    <thead class="bg-slate-100 text-slate-600 border-b">
                        <tr>
                            <th class="p-3">單號</th>
                            <th class="p-3">地點 / 類別</th>
                            <th class="p-3">故障描述</th>
                            <th class="p-3">目前狀態</th>
                            <th class="p-3">變更狀態</th>
                        </tr>
                    </thead>
                    <tbody id="admin-table-body" class="divide-y">
                        <!-- JavaScript 動態渲染表格 -->
                    </tbody>
                </table>
            </div>
        </section>

    </main>

<script>
    // ⚠️ 請替換為您從 Google Apps Script 取得的部署網址
    const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzSYmhW5yEHw9UxeaDKQFoyfSQ90rmYZDK3iHoIT6TBV4iSZnmzncRNzbjCMrNc82-j/exec';

    let tickets = [];

// 強化修正版：安全讀取 Google Apps Script 資料
async function fetchTickets() {
    const container = document.getElementById('tracker-list');
    container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-xl border"><i class="fa-solid fa-spinner fa-spin mr-2"></i>資料載入中...</div>`;

    try {
        const res = await fetch(GAS_API_URL);
        const data = await res.json();

        // 確保 data 是陣列，若不是則設為空陣列
        if (!Array.isArray(data)) {
            console.error("回傳資料非陣列格式:", data);
            tickets = [];
        } else {
            // 過濾掉全空的資料列，並轉換欄位
            tickets = data
                .filter(item => item && (item['單號'] || item['報修地點'] || item['故障描述']))
                .map(item => ({
                    id: String(item['單號'] || '無單號'),
                    date: String(item['報修時間'] || ''),
                    location: String(item['報修地點'] || '未知地點'),
                    category: String(item['設備類別'] || '未分類'),
                    reporter: String(item['報修人'] || '匿名'),
                    urgency: String(item['緊急程度'] || '普通'),
                    description: String(item['故障描述'] || '無詳細說明'),
                    status: String(item['處理狀態'] || '已送出')
                })).reverse();
        }

        renderTracker();
    } catch (err) {
        console.error("無法載入資料:", err);
        container.innerHTML = `<div class="text-center py-12 text-red-500 bg-white rounded-xl border"><i class="fa-solid fa-circle-exclamation mr-2"></i>資料載入失敗，請檢查 API 網址或 GAS 權限。</div>`;
    }
}

// 強化修正版：渲染清單
function renderTracker() {
    const container = document.getElementById('tracker-list');
    const searchInput = document.getElementById('search-input');
    const filterStatus = document.getElementById('filter-status');

    const search = searchInput ? searchInput.value.toLowerCase() : '';
    const filter = filterStatus ? filterStatus.value : 'all';

    const filtered = tickets.filter(t => {
        const matchText = (t.location || '').toLowerCase().includes(search) || 
                          (t.description || '').toLowerCase().includes(search) ||
                          (t.category || '').toLowerCase().includes(search);
        const matchStatus = filter === 'all' || t.status === filter;
        return matchText && matchStatus;
    });

    if (filtered.length === 0) {
        container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-xl border">目前尚無報修紀錄</div>`;
        return;
    }

    container.innerHTML = filtered.map(t => `
        <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100 space-y-2">
            <div class="flex justify-between items-start">
                <div>
                    <span class="text-xs text-slate-400 font-mono">${t.id} ${t.date ? '• ' + t.date : ''}</span>
                    <h3 class="text-base font-bold text-slate-800 mt-0.5">${t.location} - <span class="text-indigo-600">${t.category}</span></h3>
                </div>
                <div>${getStatusBadge(t.status)}</div>
            </div>
            <p class="text-slate-600 text-sm bg-slate-50 p-3 rounded-lg border border-slate-100">${t.description}</p>
            <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
                <span>報修人：${t.reporter}</span>
                <span>緊急度：<strong class="${t.urgency === '緊急' ? 'text-red-500' : 'text-slate-700'}">${t.urgency}</strong></span>
            </div>
        </div>
    `).join('');
}

    // 首次開啟頁面時載入資料
    fetchTickets();
</script>
</body>
</html>
