<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>沙中校內設備報修與進度查詢系統</title>
    <!-- 載入 Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

    <!-- 頂部導覽列 -->
    <header class="bg-indigo-600 text-white shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-4 flex flex-col sm:flex-row justify-between items-center gap-2">
            <div class="flex items-center space-x-3">
                <i class="fa-solid fa-wrench text-2xl"></i>
                <h1 class="text-xl font-bold tracking-wide">沙中校內設備報修與進度查詢系統</h1>
            </div>
            <!-- 切換頁籤（已移除總務處管理） -->
            <nav class="flex bg-indigo-700 rounded-lg p-1 space-x-1 text-sm">
                <button id="tab-form-btn" onclick="switchTab('form')" class="px-4 py-2 rounded-md font-medium transition bg-white text-indigo-700 shadow">
                    <i class="fa-solid fa-pen-to-square mr-1"></i>我要報修
                </button>
                <button id="tab-tracker-btn" onclick="switchTab('tracker')" class="px-4 py-2 rounded-md font-medium transition text-indigo-100 hover:text-white">
                    <i class="fa-solid fa-list-check mr-1"></i>進度查詢
                </button>
            </nav>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-8">

        <!-- 頁籤 1：我要報修 -->
        <section id="tab-form" class="bg-white rounded-xl shadow-md p-6 border border-slate-100">
            <div class="mb-6 border-b pb-4">
                <h2 class="text-lg font-bold text-slate-700">設備報修單</h2>
                <p class="text-sm text-slate-500">報修請填寫線上報修單；如遇緊急狀況（例如水管爆裂、牆面剝落、地板隆起、停電、電梯故障等），請立即電話通知總務處，以利及時派員修繕。資訊/視聽（投影機、電腦、喇叭...等）填報後轉教務處處理</p>
            </div>

            <form id="repair-form" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">報修地點 <span class="text-red-500">*</span></label>
                        <input type="text" id="location" required placeholder="例如：701教室、圖書館2樓" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">設備類別 <span class="text-red-500">*</span></label>
                        <select id="category" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="">請選擇類別</option>
                            <option value="水電設施">水電設施（燈具、插座、水龍頭...等）</option>
                            <option value="資訊/視聽">資訊/視聽（投影機、電腦、喇叭...等資訊設備）</option>
                            <option value="桌椅家具">桌椅家具（課桌椅、門窗、櫃子...等）</option>
                            <option value="冷氣通風">冷氣通風（冷氣機、電風扇...等）</option>
                            <option value="其他">其他</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">報修人 / 班級 <span class="text-red-500">*</span></label>
                        <input type="text" id="reporter" required placeholder="例如：701學生王小明或楊大明老師" class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-slate-700 mb-1">緊急程度 <span class="text-red-500">*</span></label>
                        <select id="urgency" required class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
                            <option value="普通">普通（不影響正常教學）</option>
                            <option value="高">高（影響教學或有安全隱患）</option>
                            <option value="緊急">緊急（嚴重影響安全或極度緊急）</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">故障狀況描述 <span class="text-red-500">*</span></label>
                    <textarea id="description" rows="4" required placeholder="請具體說明損壞情況，例如：前門冷氣不冷且發出異音..." class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
                </div>

                <div class="pt-2">
                    <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2.5 rounded-lg transition shadow">
                        <i class="fa-solid fa-paper-plane mr-2"></i>送出報修單
                    </button>
                </div>
            </form>
        </section>

        <!-- 頁籤 2：進度查詢 -->
        <section id="tab-tracker" class="space-y-4 hidden">
            <!-- 搜尋、篩選與手動重新整理列 -->
            <div class="bg-white rounded-xl shadow-md p-4 border border-slate-100 flex flex-col md:flex-row gap-3 items-center">
                <input type="text" id="search-input" oninput="renderTracker()" placeholder="搜尋地點或描述..." class="w-full md:flex-1 px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                <select id="filter-status" onchange="renderTracker()" class="w-full md:w-auto px-3 py-2 border rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none text-sm">
                    <option value="all">所有處理狀態</option>
                    <option value="已送出">已送出</option>
                    <option value="維修中">維修中</option>
                    <option value="已完工">已完工</option>
                </select>
                <button onclick="fetchTickets()" class="w-full md:w-auto px-4 py-2 bg-slate-100 hover:bg-slate-200 text-slate-700 text-sm rounded-lg border font-medium transition flex items-center justify-center gap-2 whitespace-nowrap">
                    <i id="refresh-icon" class="fa-solid fa-arrows-rotate"></i>重新整理
                </button>
            </div>

            <!-- 清單列表 -->
            <div id="tracker-list" class="space-y-3">
                <!-- JavaScript 動態渲染項目 -->
            </div>
        </section>

    </main>

    <script>
        // ⚠️ 請替換為您從 Google Apps Script 取得的部署網址
        const GAS_API_URL = 'https://script.google.com/macros/s/AKfycbzr19gIQYIac7xCRPZDTvQccpXQX6XDHjLno1ynd1V-0sfEqTTzbU106tGAbcocsQJA/exec';

        let tickets = [];
        let autoRefreshTimer = null;

        // 向 Google 試算表抓取最新資料
        async function fetchTickets(isSilent = false) {
            const container = document.getElementById('tracker-list');
            const refreshIcon = document.getElementById('refresh-icon');
            
            if (!isSilent && container) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-xl border"><i class="fa-solid fa-spinner fa-spin mr-2"></i>正在讀取最新報修資料...</div>`;
            }
            if (refreshIcon) refreshIcon.classList.add('fa-spin');

            try {
                const timestamp = new Date().getTime();
                const res = await fetch(`${GAS_API_URL}?t=${timestamp}`);
                const data = await res.json();
                
                tickets = data.map((item, index) => ({
                    id: item['單號'] || `R${String(index + 1).padStart(3, '0')}`,
                    date: item['報修時間'] || '未知時間',
                    location: item['報修地點'] || '未填寫地點',
                    category: item['設備類別'] || '其他',
                    reporter: item['報修人'] || '匿名',
                    urgency: item['緊急程度'] || '普通',
                    description: item['故障描述'] || '無內容描述',
                    status: item['處理狀態'] || '已送出'
                })).reverse(); // 讓最新發布的報修靠前顯示

                renderTracker();
            } catch (err) {
                console.error("無法載入資料:", err);
                if (!isSilent && container) {
                    container.innerHTML = `<div class="text-center py-12 text-red-500 bg-white rounded-xl border"><i class="fa-solid fa-triangle-exclamation mr-2"></i>資料載入失敗，請檢查 API 網址或網路連線。</div>`;
                }
            } finally {
                if (refreshIcon) refreshIcon.classList.remove('fa-spin');
            }
        }

        // 開啟/關閉 自動輪詢機制 (每 15 秒背景刷新)
        function startAutoRefresh() {
            stopAutoRefresh();
            autoRefreshTimer = setInterval(() => {
                const trackerTab = document.getElementById('tab-tracker');
                if (trackerTab && !trackerTab.classList.contains('hidden')) {
                    fetchTickets(true);
                }
            }, 15000);
        }

        function stopAutoRefresh() {
            if (autoRefreshTimer) {
                clearInterval(autoRefreshTimer);
                autoRefreshTimer = null;
            }
        }

        // 頁籤切換邏輯
        function switchTab(tabName) {
            ['form', 'tracker'].forEach(tab => {
                const el = document.getElementById(`tab-${tab}`);
                const btn = document.getElementById(`tab-${tab}-btn`);
                if (tab === tabName) {
                    el.classList.remove('hidden');
                    btn.classList.add('bg-white', 'text-indigo-700', 'shadow');
                    btn.classList.remove('text-indigo-100');
                } else {
                    el.classList.add('hidden');
                    btn.classList.remove('bg-white', 'text-indigo-700', 'shadow');
                    btn.classList.add('text-indigo-100');
                }
            });

            if (tabName === 'tracker') {
                fetchTickets();
                startAutoRefresh();
            } else {
                stopAutoRefresh();
            }
        }

        // 送出表單資料至 Google 試算表
        async function handleFormSubmit(e) {
            e.preventDefault();
            
            const submitBtn = e.target.querySelector('button[type="submit"]');
            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin mr-2"></i>傳送中...';

            const payload = {
                location: document.getElementById('location').value,
                category: document.getElementById('category').value,
                reporter: document.getElementById('reporter').value,
                urgency: document.getElementById('urgency').value,
                description: document.getElementById('description').value
            };

            try {
                const res = await fetch(GAS_API_URL, {
                    method: 'POST',
                    body: JSON.stringify(payload)
                });
                const result = await res.json();

                if (result.status === 'success') {
                    alert(`報修成功！您的報修單號為：${result.id}`);
                    document.getElementById('repair-form').reset();
                    switchTab('tracker');
                } else {
                    alert('報修失敗：' + result.message);
                }
            } catch (err) {
                alert('傳送發生錯誤，請稍後再試');
                console.error(err);
            } finally {
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fa-solid fa-paper-plane mr-2"></i>送出報修單';
            }
        }

        // 取得狀態標籤 HTML
        function getStatusBadge(status) {
            switch(status) {
                case '已送出':
                    return `<span class="bg-amber-100 text-amber-800 text-xs px-2.5 py-1 rounded-full font-semibold border border-amber-200"><i class="fa-solid fa-clock mr-1"></i>已送出</span>`;
                case '維修中':
                    return `<span class="bg-blue-100 text-blue-800 text-xs px-2.5 py-1 rounded-full font-semibold border border-blue-200"><i class="fa-solid fa-screwdriver-wrench mr-1"></i>維修中</span>`;
                case '已完工':
                    return `<span class="bg-emerald-100 text-emerald-800 text-xs px-2.5 py-1 rounded-full font-semibold border border-emerald-200"><i class="fa-solid fa-circle-check mr-1"></i>已完工</span>`;
                default:
                    return `<span class="bg-slate-100 text-slate-800 text-xs px-2.5 py-1 rounded-full font-semibold">${status}</span>`;
            }
        }

        // 渲染進度看板
        function renderTracker() {
            const container = document.getElementById('tracker-list');
            const search = document.getElementById('search-input').value.toLowerCase();
            const filter = document.getElementById('filter-status').value;

            const filtered = tickets.filter(t => {
                const matchText = (t.location || '').toLowerCase().includes(search) || (t.description || '').toLowerCase().includes(search);
                const matchStatus = filter === 'all' || t.status === filter;
                return matchText && matchStatus;
            });

            if (filtered.length === 0) {
                container.innerHTML = `<div class="text-center py-12 text-slate-400 bg-white rounded-xl border">目前無報修紀錄或無符合條件項目</div>`;
                return;
            }

            container.innerHTML = filtered.map(t => `
                <div class="bg-white rounded-xl p-5 shadow-sm border border-slate-100 space-y-2">
                    <div class="flex justify-between items-start">
                        <div>
                            <span class="text-xs text-slate-400 font-mono">${t.id} • ${t.date}</span>
                            <h3 class="text-base font-bold text-slate-800 mt-0.5">${t.location} - <span class="text-indigo-600">${t.category}</span></h3>
                        </div>
                        <div>${getStatusBadge(t.status)}</div>
                    </div>
                    <p class="text-slate-600 text-sm bg-slate-50 p-3 rounded-lg border border-slate-100">${t.description}</p>
                    <div class="flex justify-between items-center text-xs text-slate-500 pt-1">
                        <span>報修人：${t.reporter}</span>
                        <span>緊急度：<strong class="${t.urgency === '緊急' ? 'text-red-500' : 'text-slate-700'}">${t.urgency}</strong></span>
                    </div>
                </div>
            `).join('');
        }

        // 初始化執行
        fetchTickets();
        startAutoRefresh();
    </script>
</body>
</html>
</body>
</html>
